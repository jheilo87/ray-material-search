/* 2026-07-30 큰 카드 버튼 효과: 기능 변경 없음 */
.hero,.calendar,.db{
  position:relative;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  transform:translateY(0) scale(1);
  will-change:transform,box-shadow,filter;
  transition:transform .11s cubic-bezier(.2,.8,.2,1),box-shadow .11s ease,border-color .11s ease,filter .11s ease;
}
.hero{box-shadow:0 11px 0 rgba(58,85,112,.055),0 16px 28px rgba(34,58,88,.10)}
.calendar{box-shadow:0 10px 0 rgba(91,57,210,.045),0 15px 26px rgba(61,42,139,.09)}
.db{box-shadow:0 7px 0 rgba(45,70,95,.045),0 12px 23px rgba(34,58,88,.08)}
.hero::after,.calendar::after,.db::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 42%);
}
.hero:active,.calendar:active,.db:active{
  transform:translateY(4px) scale(.982);
  filter:saturate(.98);
}
.hero:active{box-shadow:0 3px 0 rgba(58,85,112,.06),0 5px 12px rgba(34,58,88,.08)}
.calendar:active{box-shadow:0 3px 0 rgba(91,57,210,.05),0 5px 12px rgba(61,42,139,.07)}
.db:active{box-shadow:0 2px 0 rgba(45,70,95,.04),0 4px 10px rgba(34,58,88,.07)}
.hero:active .arrow,.calendar:active .go{
  transform:scale(.91);
  box-shadow:0 3px 9px rgba(46,72,104,.10);
}
.arrow,.calendar .go{
  transition:transform .11s ease,box-shadow .11s ease,background-color .11s ease,color .11s ease;
}
.hero.blue:active .arrow{background:#08a2dc;color:#fff}
.hero.green:active .arrow{background:#25b26f;color:#fff}
.calendar:active .go{background:var(--purple);color:#fff}
@media (hover:hover){
  .hero:hover,.calendar:hover,.db:hover{transform:translateY(-2px)}
  .hero:hover{box-shadow:0 13px 0 rgba(58,85,112,.05),0 20px 32px rgba(34,58,88,.12)}
  .calendar:hover{box-shadow:0 12px 0 rgba(91,57,210,.04),0 19px 30px rgba(61,42,139,.11)}
  .db:hover{box-shadow:0 9px 0 rgba(45,70,95,.04),0 15px 26px rgba(34,58,88,.10)}
}

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
(function(){

const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function parseMainMaterial(buffer){const book=XLSX.read(buffer,{type:'array'});const sheetName=book.SheetNames.includes('위치')?'위치':book.SheetNames[0];const rows=XLSX.utils.sheet_to_json(book.Sheets[sheetName],{header:1,defval:''});let headerRow=-1,codeCol=-1,nameCol=-1,locCol=-1;for(let i=0;i<Math.min(rows.length,30);i++){const h=rows[i];const c=mainPickHeader(h,['품번','품목코드','자재코드']);const l=mainPickHeader(h,['위치','로케이션','LOCATION']);if(c>=0&&l>=0){headerRow=i;codeCol=c;locCol=l;nameCol=mainPickHeader(h,['자재내역','품명','품목명','자재명','제품명','내역','DESCRIPTION','DESC','규격']);break;}}if(headerRow<0)throw new Error('품번/위치 열을 찾지 못했습니다.');return rows.slice(headerRow+1).map(row=>({code:String(row[codeCol]??'').trim(),name:nameCol>=0?String(row[nameCol]??'').trim():'',location:String(row[locCol]??'').trim()||'N/A'})).filter(row=>row.code);}
async function loadMainMaterial(){try{const response=await fetch('./material.xlsx?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('material.xlsx');MAIN_MATERIAL=parseMainMaterial(await response.arrayBuffer());}catch(error){MAIN_MATERIAL=[];}}
function showMainResults(query){const box=document.getElementById('mainResults'),list=document.getElementById('mainResultList'),count=document.getElementById('mainResultsCount'),more=document.getElementById('mainResultMore');const q=String(query||'').trim();if(!q){box.classList.remove('show');return;}const nq=mainNorm(q);const hits=MAIN_MATERIAL.filter(row=>mainNorm(row.code).includes(nq)||mainNorm(row.name).includes(nq));const shown=hits.slice(0,6);count.textContent=`${hits.length.toLocaleString()}건`;more.href='search.html?q='+encodeURIComponent(q);more.style.display=hits.length?'block':'none';list.innerHTML=shown.length?shown.map(row=>`<a class="mainResult" href="search.html?q=${encodeURIComponent(row.code)}"><div><div class="mainResultCode">${esc(row.code)}</div><div class="mainResultName">${esc(row.name||'품명 정보 없음')}</div></div><div class="mainResultLoc">📍 ${esc(row.location)}</div></a>`).join(''):`<div class="mainResultEmpty">검색되는 품번이나 품명이 없습니다.<br>다른 검색어로 다시 확인해 주세요.</div>`;box.classList.add('show');}
document.getElementById('mainSearch').addEventListener('submit',e=>{e.preventDefault();showMainResults(document.getElementById('mainQ').value);});
document.getElementById('mainQ').addEventListener('input',e=>{if(!e.target.value.trim())document.getElementById('mainResults').classList.remove('show');});
async function status(){try{const r=await fetch('./material.xlsx?t='+Date.now(),{cache:'no-store'});document.getElementById('dbState').textContent=r.ok?'정상':'오류';}catch(e){document.getElementById('dbState').textContent='오프라인'}try{const r=await fetch('./Calendar.xlsx?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const wb=XLSX.read(await r.arrayBuffer(),{type:'array',cellDates:true});const now=new Date(), key=[now.getFullYear(),now.getMonth(),now.getDate()].join('-');let vendors=[];wb.SheetNames.forEach(n=>{XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true}).slice(1).forEach(row=>{const d=row[1] instanceof Date?row[1]:new Date(row[1]);if(!isNaN(d)&&[d.getFullYear(),d.getMonth(),d.getDate()].join('-')===key)vendors.push(row[0]||n)})});const dateLabel=`${now.getMonth()+1}월 ${now.getDate()}일`;document.getElementById('todayText').textContent=vendors.length?`${dateLabel} ${[...new Set(vendors)].join(' · ')} 입고 예정`:`${dateLabel} 입고 없습니다.`;}catch(e){}}
document.getElementById('adminEntry').addEventListener('click',()=>{const saved=sessionStorage.getItem('rayAdminLoggedIn')==='1';if(saved){location.href='calendar.html?admin=1';return}const pw=prompt('관리자 비밀번호를 입력해 주세요.');if(pw===null)return;if(pw==='1234'){sessionStorage.setItem('rayAdminLoggedIn','1');location.href='calendar.html?admin=1'}else alert('비밀번호가 올바르지 않습니다.')});
renderQuick();status();loadMainMaterial();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script></body></html>
