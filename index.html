/* 2026-07-30 메인 화면 디자인 보정: 기존 기능 유지 */
body{background:linear-gradient(180deg,#f2f6fb 0%,#edf3f9 100%)}
.app{padding:0 0 28px}
.shell{border:0;border-radius:0;box-shadow:none;padding:22px 22px 28px;min-height:100dvh}
.top{align-items:center;justify-content:space-between;padding:2px 2px 4px}
.logo{font-size:43px;letter-spacing:-3.5px;line-height:1}
.logo small{font-size:27px;letter-spacing:-2px}
.sub{margin-top:7px;font-size:15px;font-weight:700;color:#8a92a2;letter-spacing:-.2px}
.search{margin-top:25px;height:68px;border:1px solid #dfe5ed;border-radius:24px;padding:0 20px;background:#fff;box-shadow:0 8px 24px rgba(31,57,88,.08)}
.searchIcon{font-size:31px;color:#7f8899}
.search input{font-size:19px;background:transparent}
.hero,.calendar,.db,.quick,.adminEntry{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.hero{margin-top:18px;min-height:166px;border-width:1px!important;border-radius:26px;padding:26px 24px;box-shadow:0 10px 24px rgba(34,58,88,.08)}
.hero:active,.calendar:active,.db:active,.adminEntry:active{transform:scale(.985)}
.hero.blue{background:linear-gradient(135deg,#eefaff 0%,#f8fdff 100%);border-color:#9fdcf0!important}
.hero.green{background:linear-gradient(135deg,#effcf5 0%,#fbfffd 100%);border-color:#a9dfc2!important}
.bigIcon{font-size:68px}
.hero h2{font-size:31px;letter-spacing:-1.2px;margin-bottom:9px}
.hero p{font-size:17px;color:#6c7587}
.arrow,.calendar .go{width:52px;height:52px;font-size:32px;box-shadow:0 8px 20px rgba(46,72,104,.12)}
.calendar{margin-top:18px;min-height:132px;border-width:1px;border-radius:25px;padding:20px 22px;background:linear-gradient(135deg,#f6f3ff 0%,#fbfaff 100%);box-shadow:0 10px 24px rgba(61,42,139,.07)}
.calendar .ico{font-size:61px}
.calendar h2{font-size:28px;letter-spacing:-1px}
.calendar p{font-size:16px;color:#5d6678}
.db{margin-top:18px;min-height:82px;border-radius:22px;padding:14px 18px;background:#fff;box-shadow:0 8px 22px rgba(34,58,88,.07)}

.db strong{font-size:18px;letter-spacing:-.4px}
.pill{padding:6px 12px;font-size:14px}
.db .chev{font-size:26px}
.quick{margin-top:18px;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(34,58,88,.06)}
.adminEntry{border-radius:20px;box-shadow:0 8px 20px rgba(34,58,88,.05)}
@media(max-width:520px){

/* 2026-07-30 큰 카드 버튼 효과: 기능 변경 없음 */
.hero,.calendar,.db{
  position:relative;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  transform:translateY(0) scale(1);
  will-change:transform,box-shadow,filter;
  transition:transform .11s cubic-bezier(.2,.8,.2,1),box-shadow .11s ease,border-color .11s ease,filter .11s ease;
}
.hero{box-shadow:0 11px 0 rgba(58,85,112,.055),0 16px 28px rgba(34,58,88,.10)}
.calendar{box-shadow:0 10px 0 rgba(91,57,210,.045),0 15px 26px rgba(61,42,139,.09)}
.db{box-shadow:0 7px 0 rgba(45,70,95,.045),0 12px 23px rgba(34,58,88,.08)}
.hero::after,.calendar::after,.db::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 42%);
}
.hero:active,.calendar:active,.db:active{
  transform:translateY(4px) scale(.982);
  filter:saturate(.98);
}
.hero:active{box-shadow:0 3px 0 rgba(58,85,112,.06),0 5px 12px rgba(34,58,88,.08)}
.calendar:active{box-shadow:0 3px 0 rgba(91,57,210,.05),0 5px 12px rgba(61,42,139,.07)}
.db:active{box-shadow:0 2px 0 rgba(45,70,95,.04),0 4px 10px rgba(34,58,88,.07)}
.hero:active .arrow,.calendar:active .go{
  transform:scale(.91);
  box-shadow:0 3px 9px rgba(46,72,104,.10);
}
.arrow,.calendar .go{
  transition:transform .11s ease,box-shadow .11s ease,background-color .11s ease,color .11s ease;
}
.hero.blue:active .arrow{background:#08a2dc;color:#fff}
.hero.green:active .arrow{background:#25b26f;color:#fff}
.calendar:active .go{background:var(--purple);color:#fff}
@media (hover:hover){
  .hero:hover,.calendar:hover,.db:hover{transform:translateY(-2px)}
  .hero:hover{box-shadow:0 13px 0 rgba(58,85,112,.05),0 20px 32px rgba(34,58,88,.12)}
  .calendar:hover{box-shadow:0 12px 0 rgba(91,57,210,.04),0 19px 30px rgba(61,42,139,.11)}
  .db:hover{box-shadow:0 9px 0 rgba(45,70,95,.04),0 15px 26px rgba(34,58,88,.10)}
}


/* 2026-07-30 색상 포인트 강화: 밝은 배경은 유지하고 버튼 존재감만 높임 */
.hero,.calendar{overflow:hidden}
.hero::before,.calendar::before{
  content:"";
  position:absolute;
  left:0;
  top:22px;
  bottom:22px;
  width:5px;
  border-radius:0 5px 5px 0;
  opacity:.95;
  z-index:1;
}
.hero.blue::before{background:#008fcf;box-shadow:2px 0 10px rgba(0,143,207,.20)}
.hero.green::before{background:#149e61;box-shadow:2px 0 10px rgba(20,158,97,.18)}
.calendar::before{background:#5532c7;box-shadow:2px 0 10px rgba(85,50,199,.18)}
.hero>*,.calendar>*{position:relative;z-index:2}
.hero.blue{border-color:#66c9ea!important;background:linear-gradient(135deg,#e8f8fe 0%,#f6fcff 100%)}
.hero.green{border-color:#82d2a7!important;background:linear-gradient(135deg,#eaf9f1 0%,#f8fdfb 100%)}
.calendar{border-color:#bbb0ef;background:linear-gradient(135deg,#f1edff 0%,#faf8ff 100%)}
.hero.blue .bigIcon,.hero.blue h2{color:#008fcf}
.hero.green .bigIcon,.hero.green h2{color:#149e61}
.calendar .ico,.calendar h2{color:#5532c7}
.hero h2,.calendar h2{font-weight:950;text-shadow:0 1px 0 rgba(255,255,255,.72)}
.bigIcon,.calendar .ico{font-weight:900;filter:saturate(1.08)}
.hero p,.calendar p{color:#566176;font-weight:650}
.hero.blue .arrow{color:#008fcf;border:1px solid rgba(0,143,207,.10)}
.hero.green .arrow{color:#149e61;border:1px solid rgba(20,158,97,.10)}
.calendar .go{color:#5532c7;border:1px solid rgba(85,50,199,.10)}
.hero.blue{box-shadow:0 11px 0 rgba(0,143,207,.065),0 17px 29px rgba(0,111,163,.12)}
.hero.green{box-shadow:0 11px 0 rgba(20,158,97,.06),0 17px 29px rgba(15,122,76,.105)}
.calendar{box-shadow:0 10px 0 rgba(85,50,199,.055),0 16px 28px rgba(69,42,153,.10)}
.hero.blue:active{border-color:#279fd2!important;box-shadow:0 3px 0 rgba(0,143,207,.07),0 5px 12px rgba(0,111,163,.09)}
.hero.green:active{border-color:#42b77a!important;box-shadow:0 3px 0 rgba(20,158,97,.065),0 5px 12px rgba(15,122,76,.085)}
.calendar:active{border-color:#7b65d6;box-shadow:0 3px 0 rgba(85,50,199,.06),0 5px 12px rgba(69,42,153,.08)}
.hero.blue:active .arrow{background:#008fcf}
.hero.green:active .arrow{background:#149e61}
.calendar:active .go{background:#5532c7}
@media(max-width:520px){
  .hero::before,.calendar::before{top:18px;bottom:18px;width:4px}
}

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
(function(){
  const close=()=>{const el=document.getElementById('v11Splash');if(!el)return;el.classList.add('hide');setTimeout(()=>el.remove(),320)};
  window.addEventListener('load',()=>setTimeout(close,800));
  setTimeout(close,1600);
})();
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const incomingVendorTypes={
  '세진팩':'폼 · ACC',
  '오지인터팩코리아':'대장비',
  '일신포장산업':'소장비',
  '동진물류포장':'파렛트'
};
function normalizeIncomingVendor(v){
  const n=String(v||'').replace(/\s/g,'').replace(/[㈜()（）]/g,'').replace(/주식회사/g,'').toLowerCase();
  if(n.includes('세진'))return '세진팩';
  if(n.includes('오지')||n.includes('ojinterpack'))return '오지인터팩코리아';
  if(n.includes('일신'))return '일신포장산업';
  if(n.includes('동진'))return '동진물류포장';
  return String(v||'').trim();
}
function incomingVendorDisplay(v){
  const vendor=normalizeIncomingVendor(v);
  const short=vendor==='오지인터팩코리아'?'오지인터팩':vendor;
  return incomingVendorTypes[vendor]?`${short} (${incomingVendorTypes[vendor]})`:short;
}
function koreanWeekday(date){
  return ['일','월','화','수','목','금','토'][date.getDay()];
}

function showIncomingTodayPopup(vendors, now){
  if(!Array.isArray(vendors)||!vendors.length)return;

  // 같은 날짜에는 한 번만 표시
  const popupKey=`rayIncomingPopup_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  if(sessionStorage.getItem(popupKey)==='1')return;

  const overlay=document.getElementById('incomingTodayOverlay');
  const dateEl=document.getElementById('incomingTodayDate');
  const listEl=document.getElementById('incomingTodayList');
  if(!overlay||!dateEl||!listEl)return;

  dateEl.textContent=`${now.getMonth()+1}월 ${now.getDate()}일(${koreanWeekday(now)})`;
  listEl.innerHTML=vendors.map(v=>`<div class="incomingTodayItem">${esc(v)}</div>`).join('');
  overlay.classList.add('show');
  sessionStorage.setItem(popupKey,'1');
}

document.getElementById('incomingTodayClose')?.addEventListener('click',()=>{
  document.getElementById('incomingTodayOverlay')?.classList.remove('show');
});
document.getElementById('incomingTodayOverlay')?.addEventListener('click',e=>{
  if(e.target===e.currentTarget)e.currentTarget.classList.remove('show');
});
function renderQuick(){let rs=[],fs=[];try{rs=JSON.parse(localStorage.getItem('rayRecents')||'[]');fs=JSON.parse(localStorage.getItem('rayFavorites')||'[]')}catch(e){}document.getElementById('recent').innerHTML=rs.length?rs.slice(0,4).map(x=>`<a class="chip" href="search.html?q=${encodeURIComponent(x.q)}">${esc(x.q)}</a>`).join(''):'<span class="empty">검색 기록 없음</span>';document.getElementById('favorite').innerHTML=fs.length?fs.slice(0,4).map(x=>`<a class="chip" href="search.html?q=${encodeURIComponent(x)}">★ ${esc(x)}</a>`).join(''):'<span class="empty">즐겨찾기 없음</span>'}
let MAIN_MATERIAL=[];
const mainNorm=value=>String(value??'').toLowerCase().replace(/\s+/g,'').replace(/[-_.]/g,'');
const mainPickHeader=(headers,names)=>headers.findIndex(h=>names.some(name=>String(h??'').replace(/\s/g,'').toUpperCase().includes(String(name).replace(/\s/g,'').toUpperCase())));
function parseMainMaterial(buffer){const book=XLSX.read(buffer,{type:'array'});const sheetName=book.SheetNames.includes('위치')?'위치':book.SheetNames[0];const rows=XLSX.utils.sheet_to_json(book.Sheets[sheetName],{header:1,defval:''});let headerRow=-1,codeCol=-1,nameCol=-1,locCol=-1;for(let i=0;i<Math.min(rows.length,30);i++){const h=rows[i];const c=mainPickHeader(h,['품번','품목코드','자재코드']);const l=mainPickHeader(h,['위치','로케이션','LOCATION']);if(c>=0&&l>=0){headerRow=i;codeCol=c;locCol=l;nameCol=mainPickHeader(h,['자재내역','품명','품목명','자재명','제품명','내역','DESCRIPTION','DESC','규격']);break;}}if(headerRow<0)throw new Error('품번/위치 열을 찾지 못했습니다.');return rows.slice(headerRow+1).map(row=>({code:String(row[codeCol]??'').trim(),name:nameCol>=0?String(row[nameCol]??'').trim():'',location:String(row[locCol]??'').trim()||'N/A'})).filter(row=>row.code);}
async function loadMainMaterial(){
  try{
    const response=await fetch('./material.xlsx?t='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('material.xlsx');
    MAIN_MATERIAL=parseMainMaterial(await response.arrayBuffer());
    return {ok:true,count:MAIN_MATERIAL.length};
  }catch(error){
    MAIN_MATERIAL=[];
    return {ok:false,count:0};
  }
}
function showMainResults(query){const box=document.getElementById('mainResults'),list=document.getElementById('mainResultList'),count=document.getElementById('mainResultsCount'),more=document.getElementById('mainResultMore');const q=String(query||'').trim();if(!q){box.classList.remove('show');return;}const nq=mainNorm(q);const hits=MAIN_MATERIAL.filter(row=>mainNorm(row.code).includes(nq)||mainNorm(row.name).includes(nq));const shown=hits.slice(0,6);count.textContent=`${hits.length.toLocaleString()}건`;more.href='search.html?q='+encodeURIComponent(q);more.style.display=hits.length?'block':'none';list.innerHTML=shown.length?shown.map(row=>`<a class="mainResult" href="search.html?q=${encodeURIComponent(row.code)}"><div><div class="mainResultCode">${esc(row.code)}</div><div class="mainResultName">${esc(row.name||'품명 정보 없음')}</div></div><div class="mainResultLoc">📍 ${esc(row.location)}</div></a>`).join(''):`<div class="mainResultEmpty">검색되는 품번이나 품명이 없습니다.<br>다른 검색어로 다시 확인해 주세요.</div>`;box.classList.add('show');}
document.getElementById('mainSearch').addEventListener('submit',e=>{e.preventDefault();showMainResults(document.getElementById('mainQ').value);});
document.getElementById('mainQ').addEventListener('input',e=>{if(!e.target.value.trim())document.getElementById('mainResults').classList.remove('show');});
function setDbRow(id,valueId,state,text){
  const row=document.getElementById(id);
  const value=document.getElementById(valueId);
  row.className='dbDashRow '+state;
  value.textContent=text;
}
function formatDbTime(date=new Date()){
  const pad=n=>String(n).padStart(2,'0');
  return `${date.getFullYear()}.${pad(date.getMonth()+1)}.${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}
async function loadCalendarDashboard(){
  try{
    const r=await fetch('./Calendar.xlsx?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Calendar.xlsx');
    const wb=XLSX.read(await r.arrayBuffer(),{type:'array',cellDates:true});
    const now=new Date(),todayKey=[now.getFullYear(),now.getMonth(),now.getDate()].join('-');
    let vendors=[],count=0;
    wb.SheetNames.forEach(n=>{
      XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,cellDates:true}).slice(1).forEach(row=>{
        const raw=row[1];
        let d=null;
        if(raw instanceof Date)d=raw;
        else if(typeof raw==='string'){
          const m=raw.match(/^(20\d{2})-(\d{1,2})-(\d{1,2})/);
          d=m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])):new Date(raw);
        }else d=new Date(raw);
        if(d instanceof Date&&!isNaN(d)){
          count++;
          if([d.getFullYear(),d.getMonth(),d.getDate()].join('-')===todayKey)vendors.push(row[0]||n);
        }
      });
    });
    const dateLabel=`${now.getMonth()+1}월 ${now.getDate()}일(${koreanWeekday(now)})`;
    const todayVendors=[...new Set(vendors.map(incomingVendorDisplay).filter(Boolean))];
    document.getElementById('todayText').textContent=todayVendors.length
      ?`${dateLabel} ${todayVendors.join(' · ')}`
      :`${dateLabel} 입고 없습니다.`;

    const calendarCard=document.getElementById('incomingCalendarCard');
    calendarCard?.classList.toggle('hasIncoming',todayVendors.length>0);

    if(todayVendors.length){
      showIncomingTodayPopup(todayVendors,now);
    }
    return {ok:true,count};
  }catch(error){
    return {ok:false,count:0};
  }
}
async function status(){
  const material=await loadMainMaterial();
  const calendar=await loadCalendarDashboard();

  setDbRow('materialDbRow','materialDbValue',material.ok?'ok':'bad',material.ok?`${material.count.toLocaleString()}건`:'연동 오류');
  setDbRow('calendarDbRow','calendarDbValue',calendar.ok?'ok':'bad',calendar.ok?`${calendar.count.toLocaleString()}건`:'연동 오류');

  const okCount=[material.ok,calendar.ok].filter(Boolean).length;
  const overall=document.getElementById('dbOverall');
  overall.className='dbDashOverall '+(okCount===2?'ok':okCount===1?'warn':'bad');
  overall.textContent=okCount===2?'2/2 정상':okCount===1?'1/2 정상':'0/2 오류';
  document.getElementById('dbSyncTime').textContent=`마지막 확인 · ${formatDbTime()}`;
}
const ADMIN_KEY='rayAdminLoggedIn';
function isAdmin(){return localStorage.getItem(ADMIN_KEY)==='1';}
function refreshAdminState(){const active=isAdmin(),state=document.getElementById('adminState'),text=document.getElementById('adminStateText'),btn=document.getElementById('adminEntry');state.classList.toggle('admin',active);text.textContent=active?'관리자':'일반';btn.classList.toggle('admin',active);btn.classList.toggle('logout',active);btn.textContent=active?'🔓 관리자 로그아웃':'🔒 관리자 로그인';}
document.getElementById('adminEntry').addEventListener('click',()=>{if(isAdmin()){if(confirm('관리자 모드를 종료할까요?')){localStorage.removeItem(ADMIN_KEY);refreshAdminState();}return;}const pw=prompt('관리자 비밀번호를 입력해 주세요.');if(pw===null)return;if(pw==='1234'){localStorage.setItem(ADMIN_KEY,'1');refreshAdminState();alert('관리자 모드로 로그인했습니다.');}else alert('비밀번호가 올바르지 않습니다.');});
window.addEventListener('storage',e=>{if(e.key===ADMIN_KEY)refreshAdminState();});
window.addEventListener('pageshow',refreshAdminState);
renderQuick();status();refreshAdminState();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
