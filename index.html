<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e63d8"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png">
<title>RaySmart V1.0</title>
<style>
:root{--blue:#0e63d8;--navy:#10233f;--green:#0b9f72;--orange:#f59e0b;--bg:#f3f6fb;--card:#fff;--line:#dce5f1;--muted:#6b7890}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--navy)}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:calc(32px + env(safe-area-inset-bottom))}.hero{padding:calc(25px + env(safe-area-inset-top)) 20px 30px;background:linear-gradient(145deg,#0c57c6,#2686ee);color:#fff;border-radius:0 0 32px 32px;box-shadow:0 14px 34px #0e63d82b}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-size:34px;font-weight:950;letter-spacing:-2px}.ver{font-size:11px;font-weight:900;padding:7px 10px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff18}.subtitle{margin-top:6px;font-size:15px;font-weight:800;opacity:.92}.today{margin-top:22px;padding:15px;border-radius:18px;background:#ffffff16;border:1px solid #ffffff28;backdrop-filter:blur(8px)}.todayLabel{font-size:12px;opacity:.82}.todayText{font-size:18px;font-weight:950;margin-top:5px}.todaySub{font-size:12px;margin-top:5px;opacity:.82}main{padding:16px}.sectionTitle{font-size:14px;font-weight:950;margin:6px 3px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{display:flex;flex-direction:column;justify-content:space-between;min-height:156px;padding:18px;border-radius:22px;background:#fff;border:1px solid var(--line);text-decoration:none;color:inherit;box-shadow:0 8px 22px #173b6b0d}.card:active{transform:translateY(1px)}.cardIcon{width:50px;height:50px;display:grid;place-items:center;border-radius:16px;font-size:26px;font-weight:900}.search .cardIcon{background:#e8f2ff;color:var(--blue)}.sn .cardIcon{background:#e8f8f2;color:var(--green)}.calendar{grid-column:1/-1;min-height:132px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.calendar .cardIcon{background:#fff3db;color:var(--orange)}.cardTitle{font-size:20px;font-weight:950;letter-spacing:-.6px}.cardDesc{font-size:12px;line-height:1.5;color:var(--muted);margin-top:6px}.arrow{font-size:34px;color:#9aacc2}.status{margin-top:14px;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:18px}.statusRow{display:flex;justify-content:space-between;gap:12px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#12b76a;display:inline-block;margin-right:7px}.statusTitle{font-size:13px;font-weight:950}.statusText{font-size:11px;color:var(--muted);margin-top:4px}.refresh{border:0;border-radius:11px;padding:9px 11px;background:#eef4fb;color:#34516f;font-weight:900}.foot{text-align:center;color:#8a98ab;font-size:11px;padding:18px}
@media(max-width:430px){.hero{padding-left:17px;padding-right:17px}.brand{font-size:31px}main{padding:13px}.grid{gap:10px}.card{min-height:146px;padding:16px}.calendar{min-height:124px}.cardTitle{font-size:19px}}
</style>
</head>
<body><div class="app">
<header class="hero"><div class="topline"><div class="brand">RaySmart</div><div class="ver">V1.0</div></div><div class="subtitle">자재 · S/N · 입고관리</div><div class="today"><div class="todayLabel">오늘 업무</div><div class="todayText" id="todayText">입고 일정을 확인하고 있습니다</div><div class="todaySub" id="todaySub">Calendar.xlsx 자동 연결</div></div></header>
<main><div class="sectionTitle">업무 메뉴</div><div class="grid">
<a class="card search" href="./search.html"><div class="cardIcon">⌕</div><div><div class="cardTitle">자재 검색</div><div class="cardDesc">품번·품명 또는 위치로 필요한 자재를 빠르게 찾습니다.</div></div></a>
<a class="card sn" href="./sn.html"><div class="cardIcon">▥</div><div><div class="cardTitle">S/N 추출</div><div class="cardDesc">업체별 라벨을 촬영하고 S/N을 자동으로 정리합니다.</div></div></a>
<a class="card calendar" href="./calendar.html"><div class="cardIcon">▦</div><div><div class="cardTitle">입고 캘린더</div><div class="cardDesc" id="calendarSummary">업체별 입고 예정일과 완료 여부를 한눈에 확인합니다.</div></div><div class="arrow">›</div></a>
</div><div class="status"><div class="statusRow"><div><div class="statusTitle"><span class="dot"></span>GitHub 데이터 연결</div><div class="statusText">material.xlsx · Calendar.xlsx</div></div><button class="refresh" onclick="location.reload()">새로고침</button></div></div><div class="foot">RaySmart · 구매자재팀 업무 도구</div></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script>
(async()=>{try{const r=await fetch('./Calendar.xlsx?ts='+Date.now());if(!r.ok)throw 0;const wb=XLSX.read(await r.arrayBuffer(),{type:'array',cellDates:true});const now=new Date(),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let today=[];wb.SheetNames.forEach(s=>XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:''}).forEach(x=>{let d=x['입고일'];if(typeof d==='number')d=XLSX.SSF.parse_date_code(d);if(d&&! (d instanceof Date))d=new Date(d);if(d instanceof Date&&key(d)===key(now))today.push({v:x['업체명']||s,done:String(x['완료']).includes('완료')})}));document.getElementById('todayText').textContent=today.length?`오늘 입고 ${today.length}건`:'오늘 예정된 입고가 없습니다';document.getElementById('todaySub').textContent=today.length?today.map(x=>x.v+(x.done?' · 완료':'')).join(' · '):'캘린더에서 이번 달 일정을 확인하세요';document.getElementById('calendarSummary').textContent=today.length?`오늘 ${today.length}건 · ${today.map(x=>x.v).join(', ')}`:'업체별 입고 예정일과 완료 여부를 한눈에 확인합니다.'}catch(e){document.getElementById('todayText').textContent='입고 캘린더를 확인해 주세요';document.getElementById('todaySub').textContent='Calendar.xlsx 연결 확인 필요'}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
