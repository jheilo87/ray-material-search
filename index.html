<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><link rel="manifest" href="manifest.webmanifest"><title>RaySmart</title>
<style>
:root{--blue:#06a5df;--green:#28b779;--purple:#5b39d2;--ink:#10223d;--muted:#778093;--line:#e1e6ee;--bg:#f4f7fb}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:720px;margin:auto;min-height:100dvh;padding:8px 8px 28px}.shell{background:#fff;border:1px solid #edf0f4;border-radius:28px;box-shadow:0 8px 28px #23395d0b;padding:26px 24px 24px}.top{display:flex;justify-content:space-between;align-items:flex-start}.logo{font-size:48px;font-weight:1000;font-style:italic;letter-spacing:-4px;background:linear-gradient(110deg,#05a7e1 15%,#0b87db 48%,#2aa965 72%);-webkit-background-clip:text;background-clip:text;color:transparent}.logo small{font-size:30px;letter-spacing:-2px}.icons{display:flex;gap:18px;font-size:28px;color:#72798b;padding-top:10px}.sub{margin-top:2px;color:#7d8391;font-size:19px}.search{display:grid;grid-template-columns:48px 1fr 44px;align-items:center;margin-top:36px;border:1px solid #d9dee7;border-radius:22px;height:76px;padding:0 18px;box-shadow:inset 0 0 0 1px #f4f6f8}.searchIcon{font-size:35px;color:#777f91}.search input{border:0;outline:0;font-size:20px;min-width:0;color:#26364f}.search input::placeholder{color:#8b91a0}.scan{border:0;background:transparent;font-size:28px;color:#737b8d}.hero{margin-top:24px;border-radius:23px;min-height:177px;padding:28px 28px;display:grid;grid-template-columns:150px 1fr 64px;align-items:center;text-decoration:none}.hero.blue{border:1.5px solid #83d6f3;background:linear-gradient(135deg,#eefbff,#f6fbff)}.hero.green{border:1.5px solid #9bddb8;background:linear-gradient(135deg,#f1fff7,#f9fffb)}.bigIcon{font-size:75px;text-align:center}.hero.blue .bigIcon,.hero.blue h2{color:#079dd7}.hero.green .bigIcon,.hero.green h2{color:#22ad6b}.hero h2{font-size:32px;margin:0 0 10px}.hero p{margin:0;color:#616b7d;font-size:18px}.arrow{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:38px;box-shadow:0 8px 22px #395b831a}.hero.blue .arrow{color:#08a2dc}.hero.green .arrow{color:#25b26f}.calendar{margin-top:24px;border:1.5px solid #d5cff8;background:#f7f5ff;border-radius:22px;min-height:138px;display:grid;grid-template-columns:120px 1fr 36px;align-items:center;padding:22px;text-decoration:none}.calendar .ico{font-size:66px;color:var(--purple);text-align:center}.calendar h2{margin:0 0 7px;color:var(--purple);font-size:29px}.calendar p{margin:0;color:#48546b;font-size:17px;line-height:1.5}.calendar .go{font-size:35px;color:var(--purple)}.db{margin-top:24px;border:1px solid var(--line);border-radius:19px;min-height:88px;display:grid;grid-template-columns:56px 1fr auto;align-items:center;padding:14px 20px;text-decoration:none;color:var(--ink)}.db .ico{font-size:34px;color:#20af70}.db strong{font-size:19px}.pill{margin-left:12px;background:#e7f8ee;color:#2aae69;padding:7px 14px;border-radius:999px;font-weight:800}.db .chev{font-size:30px;color:#7c8494}.quick{margin-top:20px;border:1px solid var(--line);border-radius:20px;overflow:hidden}.qsec{padding:20px 22px}.qsec+.qsec{border-top:1px solid #e7eaf0}.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.qhead strong{font-size:19px}.qhead span{color:#7c8391}.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid #e0e4eb;border-radius:999px;background:#fff;padding:10px 16px;color:#33415a;font-size:16px;text-decoration:none}.empty{color:#9aa2b0;font-size:15px}.foot{text-align:center;color:#8a92a1;padding:27px 0 2px;font-size:14px}@media(max-width:520px){.shell{padding:24px 18px}.logo{font-size:40px}.logo small{font-size:25px}.hero{grid-template-columns:105px 1fr 52px;padding:23px 16px}.bigIcon{font-size:58px}.hero h2{font-size:27px}.hero p{font-size:16px}.arrow{width:50px;height:50px}.calendar{grid-template-columns:82px 1fr 28px;padding:18px 14px}.calendar .ico{font-size:53px}.calendar h2{font-size:25px}.calendar p{font-size:15px}.search{height:70px}.search input{font-size:18px}}
</style></head><body><div class="app"><main class="shell"><div class="top"><div><div class="logo">Ray<small>Smart</small></div><div class="sub">자재 · S/N · 입고관리</div></div><div class="icons"><span>♧</span><span>♙</span></div></div>
<form class="search" id="mainSearch"><span class="searchIcon">⌕</span><input id="mainQ" placeholder="자재명, 품번, S/N 검색" autocomplete="off"><button class="scan" type="button" id="scanBtn">⌗</button></form>
<a class="hero blue" href="search.html"><div class="bigIcon">⌑⌕</div><div><h2>자재 검색</h2><p>품번, 자재명 검색</p></div><div class="arrow">›</div></a>
<a class="hero green" href="sn.html"><div class="bigIcon">▥</div><div><h2>S/N 추출</h2><p>QR/바코드 스캔</p></div><div class="arrow">›</div></a>
<a class="calendar" href="calendar.html"><div class="ico">▦</div><div><h2>입고 캘린더</h2><p id="todayText">오늘 입고 일정을 확인합니다.</p></div><div class="go">›</div></a>
<a class="db" href="search.html"><div class="ico">◉</div><div><strong>GitHub DB 최신 상태</strong><span class="pill" id="dbState">확인 중</span></div><div class="chev">›</div></a>
<div class="quick"><section class="qsec"><div class="qhead"><strong>최근 검색</strong><span>전체 보기 ›</span></div><div class="chips" id="recent"></div></section><section class="qsec"><div class="qhead"><strong>즐겨찾기</strong><span>전체 보기 ›</span></div><div class="chips" id="favorite"></div></section></div><div class="foot">© RAY Corp. All rights reserved.</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function renderQuick(){let rs=[],fs=[];try{rs=JSON.parse(localStorage.getItem('rayRecents')||'[]');fs=JSON.parse(localStorage.getItem('rayFavorites')||'[]')}catch(e){}document.getElementById('recent').innerHTML=rs.length?rs.slice(0,4).map(x=>`<a class="chip" href="search.html?q=${encodeURIComponent(x.q)}">${esc(x.q)}</a>`).join(''):'<span class="empty">검색 기록 없음</span>';document.getElementById('favorite').innerHTML=fs.length?fs.slice(0,4).map(x=>`<a class="chip" href="search.html?q=${encodeURIComponent(x)}">★ ${esc(x)}</a>`).join(''):'<span class="empty">즐겨찾기 없음</span>'}
document.getElementById('mainSearch').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('mainQ').value.trim();location.href=q?'search.html?q='+encodeURIComponent(q):'search.html'});document.getElementById('scanBtn').addEventListener('click',()=>location.href='sn.html');
async function status(){try{const r=await fetch('./material.xlsx?t='+Date.now(),{cache:'no-store'});document.getElementById('dbState').textContent=r.ok?'정상':'오류';}catch(e){document.getElementById('dbState').textContent='오프라인'}try{const r=await fetch('./Calendar.xlsx?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const wb=XLSX.read(await r.arrayBuffer(),{type:'array',cellDates:true});const now=new Date(), key=[now.getFullYear(),now.getMonth(),now.getDate()].join('-');let vendors=[];wb.SheetNames.forEach(n=>{XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true}).slice(1).forEach(row=>{const d=row[1] instanceof Date?row[1]:new Date(row[1]);if(!isNaN(d)&&[d.getFullYear(),d.getMonth(),d.getDate()].join('-')===key)vendors.push(row[0]||n)})});document.getElementById('todayText').textContent=vendors.length?`오늘 입고 ${vendors.length}건  |  ${[...new Set(vendors)].join(' · ')}`:'오늘 예정된 입고가 없습니다.';}catch(e){}}
renderQuick();status();
</script></body></html>
