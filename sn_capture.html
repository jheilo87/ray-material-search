<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20b878">
<title>RaySmart 고화질 연속촬영</title>
<style>
:root{--green:#20b878;--dark:#17324b;--muted:#68778b;--line:#dce7e3}
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--dark);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:720px;margin:auto;min-height:100dvh;padding:0 14px 28px}.head{margin:0 -14px;padding:18px 18px 16px;background:linear-gradient(135deg,#22bd7d,#19a96f);color:#fff}.head h1{margin:0;font-size:21px}.head p{margin:5px 0 0;font-size:12px;font-weight:750;opacity:.9}.card{margin-top:15px;padding:20px 18px;border:1px solid var(--line);border-radius:23px;background:#fff;box-shadow:0 7px 22px #163b2b0c}.vendor{display:inline-flex;padding:7px 12px;border-radius:99px;background:#eaf9f2;color:#159463;font-size:13px;font-weight:900}.count{margin:18px 0 4px;text-align:center;font-size:54px;font-weight:1000;color:#159b68;line-height:1}.countLabel{text-align:center;color:var(--muted);font-size:14px;font-weight:800}.guide{margin:20px 0 15px;padding:14px;border-radius:16px;background:#f3faf7;color:#4f645d;font-size:13px;line-height:1.65}.primary,.finish,.sub{width:100%;min-height:60px;border:0;border-radius:17px;font:inherit;font-size:18px;font-weight:1000}.primary{background:linear-gradient(135deg,#23bd7e,#16a86d);color:#fff;box-shadow:0 7px 16px #169b6330}.primary:active{transform:translateY(1px)}.primary:disabled{opacity:.45}.finish{margin-top:11px;background:#1769e0;color:#fff}.finish:disabled{opacity:.4}.sub{min-height:48px;margin-top:9px;background:#eef2f5;color:#526174;font-size:14px}.status{margin-top:15px;padding:13px;border-radius:14px;background:#f1f5f4;color:#536277;text-align:center;font-size:13px;font-weight:850}.status.ok{background:#eaf9f2;color:#168b60}.status.bad{background:#fff0f0;color:#b73535}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e8efed}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:5px;top:5px;min-width:23px;height:23px;padding:0 6px;display:grid;place-items:center;border-radius:99px;background:#17324be6;color:#fff;font-size:11px;font-weight:900}.hidden{position:fixed;left:-9999px;width:1px;height:1px;opacity:.01}.warn{margin-top:13px;color:#7b8797;font-size:11px;line-height:1.55;text-align:center}
</style>
</head>
<body>
<main class="app">
  <header class="head"><h1>고화질 연속촬영</h1><p>기본 카메라로 찍고 돌아와 다음 촬영을 계속 누르세요.</p></header>
  <section class="card">
    <div class="vendor" id="vendorLabel">iRay 촬영</div>
    <div class="count" id="count">0</div><div class="countLabel">저장된 사진</div>
    <div class="guide">① 아래 촬영 버튼으로 사진을 찍습니다.<br>② 돌아오면 저장 완료를 확인합니다.<br>③ 다시 ‘다음 촬영’을 눌러 계속 찍습니다.</div>
    <button class="primary" id="shootBtn" type="button">📷 첫 촬영</button>
    <button class="finish" id="finishBtn" type="button" disabled>촬영 완료 · S/N 추출</button>
    <button class="sub" id="deleteLastBtn" type="button" disabled>마지막 사진 삭제</button>
    <button class="sub" id="cancelBtn" type="button">취소하고 돌아가기</button>
    <div class="status" id="status">촬영을 시작해 주세요.</div>
    <div class="thumbs" id="thumbs"></div>
    <div class="warn">이 화면은 촬영만 담당하므로 S/N 인식 화면보다 메모리를 훨씬 적게 사용합니다.</div>
  </section>
  <input class="hidden" id="captureInput" type="file" accept="image/*" capture="environment">
</main>
<script>
(()=>{
const DB_NAME='RaySmartSNBatchDB',STORE='batchFiles',META_KEY='raySnBatchMetaV1';
const $=id=>document.getElementById(id);let photoCount=0,busy=false,previewUrls=[];
const allowed=['iRay','Dell','Vieworks','i3system'];
const params=new URLSearchParams(location.search);
const vendor=allowed.includes(params.get('vendor'))?params.get('vendor'):(sessionStorage.getItem('raySnSelectedVendor')||'iRay');
$('vendorLabel').textContent=`${vendor} 촬영`;
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});if(!db.objectStoreNames.contains('capturePhotos'))db.createObjectStore('capturePhotos',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function putRow(row){const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(row);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function deleteRow(id){const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function clearRows(){const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
function setStatus(text,type=''){const el=$('status');el.textContent=text;el.className='status'+(type?' '+type:'')}
async function makeThumb(blob){try{const bm=await createImageBitmap(blob);const side=150,c=document.createElement('canvas');c.width=side;c.height=side;const scale=Math.max(side/bm.width,side/bm.height),w=bm.width*scale,h=bm.height*scale;c.getContext('2d').drawImage(bm,(side-w)/2,(side-h)/2,w,h);bm.close();const out=await new Promise(r=>c.toBlob(r,'image/jpeg',.65));c.width=c.height=1;return out}catch{return null}}
function render(){ $('count').textContent=photoCount;$('shootBtn').textContent=photoCount?'📷 다음 촬영':'📷 첫 촬영';$('finishBtn').disabled=!photoCount;$('deleteLastBtn').disabled=!photoCount }
async function showLatestThumb(file,index){const thumb=await makeThumb(file);previewUrls.forEach(URL.revokeObjectURL);previewUrls=[];$('thumbs').innerHTML='';if(!thumb)return;const url=URL.createObjectURL(thumb);previewUrls.push(url);const el=document.createElement('div');el.className='thumb';el.innerHTML=`<img alt="최근 사진"><span>${index}</span>`;el.querySelector('img').src=url;$('thumbs').appendChild(el)}
async function startNew(){const meta=JSON.parse(localStorage.getItem(META_KEY)||'null');if(!meta||meta.status!=='capturing'||meta.mode!==vendor){await clearRows();photoCount=0;localStorage.setItem(META_KEY,JSON.stringify({batchId:`capture-${Date.now()}`,total:0,index:0,mode:vendor,status:'capturing',updatedAt:Date.now()}))}else photoCount=Number(meta.total||0);render()}
function openCamera(){if(busy)return;const input=$('captureInput');try{input.value=''}catch{};input.click()}
$('shootBtn').addEventListener('click',openCamera);
async function handleCaptureReturn(){
  const input=$('captureInput');let file=input.files?.[0];
  if(!file||busy)return;
  busy=true;$('shootBtn').disabled=true;setStatus('고화질 사진을 저장하고 있습니다…');
  try{const id=photoCount;await putRow({id,batchId:JSON.parse(localStorage.getItem(META_KEY)||'{}').batchId||`capture-${Date.now()}`,name:file.name||`photo-${id+1}.jpg`,type:file.type||'image/jpeg',lastModified:file.lastModified||Date.now(),blob:file});await showLatestThumb(file,id+1);try{input.value=''}catch{};file=null;photoCount=id+1;const meta=JSON.parse(localStorage.getItem(META_KEY)||'{}');localStorage.setItem(META_KEY,JSON.stringify({...meta,total:photoCount,index:0,mode:vendor,status:'capturing',updatedAt:Date.now()}));render();setStatus(`사진 ${photoCount}장 저장 완료 · 다음 촬영을 눌러주세요.`,'ok')}
  catch(err){setStatus('사진 저장에 실패했습니다. 다시 촬영해 주세요.','bad')}
  finally{busy=false;$('shootBtn').disabled=false}
}
// 삼성 인터넷/Chrome은 카메라 복귀 때 change 대신 input만 보내거나,
// 화면이 다시 보인 직후 늦게 파일을 연결하는 경우가 있어 모두 확인합니다.
$('captureInput').addEventListener('input',handleCaptureReturn);
$('captureInput').addEventListener('change',handleCaptureReturn);
function checkReturnedFile(){[80,300,800,1500].forEach(ms=>setTimeout(handleCaptureReturn,ms))}
window.addEventListener('pageshow',checkReturnedFile);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReturnedFile()});
$('deleteLastBtn').addEventListener('click',async()=>{if(busy||!photoCount)return;await deleteRow(photoCount-1);photoCount--;const meta=JSON.parse(localStorage.getItem(META_KEY)||'{}');localStorage.setItem(META_KEY,JSON.stringify({...meta,total:photoCount,updatedAt:Date.now()}));previewUrls.forEach(URL.revokeObjectURL);previewUrls=[];$('thumbs').innerHTML='';render();setStatus('마지막 사진을 삭제했습니다.','ok')});
$('finishBtn').addEventListener('click',()=>{if(!photoCount||busy)return;const meta=JSON.parse(localStorage.getItem(META_KEY)||'{}');localStorage.setItem(META_KEY,JSON.stringify({...meta,total:photoCount,index:0,mode:vendor,status:'running',updatedAt:Date.now()}));location.href='sn.html?resumeCapture=1'});
$('cancelBtn').addEventListener('click',()=>{location.href='sn.html'});
window.addEventListener('pagehide',()=>previewUrls.forEach(URL.revokeObjectURL));
startNew().catch(()=>setStatus('촬영 저장소를 열지 못했습니다. 브라우저를 다시 열어주세요.','bad'));
})();
</script>
</body>
</html>
