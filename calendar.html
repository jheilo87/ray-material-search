<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e63d8"><title>RaySmart · 입고 캘린더</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{--blue:#0e63d8;--navy:#10233f;--bg:#f3f6fb;--line:#dce5f1;--muted:#6b7890}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--navy)}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:35px}.head{padding:calc(16px + env(safe-area-inset-top)) 16px 18px;background:linear-gradient(145deg,#0c57c6,#2686ee);color:#fff;border-radius:0 0 26px 26px}.headTop{display:flex;align-items:center;justify-content:space-between}.back{color:#fff;text-decoration:none;font-weight:900;padding:9px 11px;border-radius:11px;background:#ffffff18}.title{font-size:24px;font-weight:950}.monthNav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-top:18px}.monthNav button{height:42px;border:1px solid #ffffff45;border-radius:12px;background:#ffffff18;color:#fff;font-size:24px}.month{text-align:center;font-size:21px;font-weight:950}.summary{margin-top:10px;text-align:center;font-size:12px;opacity:.88}main{padding:14px}.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 11px}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#53657c;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}.board{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px #173b6b0d}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week{background:#edf4fc;text-align:center;font-size:11px;font-weight:950;color:#60738b}.week span{padding:10px 2px}.week span:first-child{color:#e04f4f}.week span:last-child{color:#3478d4}.day{min-height:88px;padding:7px 4px;border-top:1px solid #edf1f6;border-right:1px solid #edf1f6;background:#fff;overflow:hidden}.day:nth-child(7n){border-right:0}.day.other{background:#f8fafc}.date{font-size:12px;font-weight:950;color:#53657c}.day:nth-child(7n+1) .date{color:#e04f4f}.day:nth-child(7n) .date{color:#3478d4}.day.other .date{opacity:.35}.day.today{background:#fff8cf;box-shadow:inset 0 0 0 2px #efc64e}.events{display:flex;flex-direction:column;gap:3px;margin-top:5px}.event{padding:4px 3px;border-radius:6px;font-size:8px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.event.done{text-decoration:line-through;opacity:.58}.sejin{background:#e6f7ed;color:#14743d}.oji{background:#e7f1ff;color:#1769e0}.ilshin{background:#fff1d8;color:#a55a00}.dongjin{background:#f2e7ff;color:#7e22ce}.more{font-size:8px;text-align:center;color:#7b899b}.state{margin-top:10px;text-align:center;font-size:11px;color:var(--muted)}.legend{margin-top:12px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;gap:10px;flex-wrap:wrap}.legend span{font-size:11px;font-weight:850}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.modal{position:fixed;inset:0;display:none;align-items:flex-end;background:#0d172666;padding:14px;z-index:50}.modal.show{display:flex}.panel{width:min(760px,100%);margin:auto;background:#fff;border-radius:24px;padding:18px;max-height:78vh;overflow:auto}.panelTitle{font-size:21px;font-weight:950}.panelSub{font-size:12px;color:var(--muted);margin-top:4px}.list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.item{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:10px}.vendor{font-weight:950}.badge{font-size:11px;font-weight:900;padding:6px 8px;border-radius:999px;background:#eef2f7;color:#5c6b7e}.badge.done{background:#e8f8ef;color:#14743d}.close{width:100%;margin-top:14px;border:0;border-radius:13px;padding:13px;background:#10233f;color:#fff;font-weight:950}@media(max-width:430px){main{padding:11px}.day{min-height:78px}.event{font-size:7.5px}}
</style></head><body><div class="app"><header class="head"><div class="headTop"><a class="back" href="./index.html">‹ 홈</a><div class="title">입고 캘린더</div><div style="width:54px"></div></div><div class="monthNav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><div class="summary" id="summary">Calendar.xlsx를 불러오고 있습니다</div></header><main><div class="filters" id="filters"></div><div class="board"><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div></div><div class="state" id="state"></div><div class="legend"><span><i style="background:#53bd7b"></i>세진팩</span><span><i style="background:#68a5ef"></i>오지인터팩</span><span><i style="background:#efb452"></i>일신포장</span><span><i style="background:#ad78e6"></i>동진물류</span></div></main></div><div class="modal" id="modal"><div class="panel"><div class="panelTitle" id="panelTitle"></div><div class="panelSub">해당 날짜의 입고 일정입니다.</div><div class="list" id="list"></div><button class="close" id="close">닫기</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script>
const vendors=['전체','세진팩','오지인터팩코리아','일신포장산업','동진물류포장'];let data=[],cursor=new Date(),active='전체';cursor.setDate(1);const cls=v=>v.includes('세진')?'sejin':v.includes('오지')?'oji':v.includes('일신')?'ilshin':'dongjin';const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function parseDate(v){if(v instanceof Date)return v;if(typeof v==='number'){const x=XLSX.SSF.parse_date_code(v);return new Date(x.y,x.m-1,x.d)}const d=new Date(v);return isNaN(d)?null:d}async function load(){try{const r=await fetch('./Calendar.xlsx?ts='+Date.now());if(!r.ok)throw Error();const wb=XLSX.read(await r.arrayBuffer(),{type:'array',cellDates:true});data=[];wb.SheetNames.forEach(s=>XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:''}).forEach(x=>{const d=parseDate(x['입고일']);if(d)data.push({vendor:String(x['업체명']||s),date:d,done:String(x['완료']).includes('완료')})}));document.getElementById('state').textContent=`총 ${data.length}건의 일정을 불러왔습니다.`;render()}catch(e){document.getElementById('state').textContent='Calendar.xlsx를 불러오지 못했습니다.';render()}}function renderFilters(){filters.innerHTML=vendors.map(v=>`<button class="filter ${active===v?'active':''}" data-v="${v}">${v==='오지인터팩코리아'?'오지인터팩':v==='일신포장산업'?'일신포장':v==='동진물류포장'?'동진물류':v}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.v;render()})}function render(){renderFilters();month.textContent=`${cursor.getFullYear()}년 ${cursor.getMonth()+1}월`;const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());days.innerHTML='';let monthItems=data.filter(x=>x.date.getFullYear()===cursor.getFullYear()&&x.date.getMonth()===cursor.getMonth()&&(active==='전체'||x.vendor===active));summary.textContent=`이번 달 ${monthItems.length}건 · 완료 ${monthItems.filter(x=>x.done).length}건`;for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const items=data.filter(x=>key(x.date)===key(d)&&(active==='전체'||x.vendor===active));const el=document.createElement('div');el.className='day'+(d.getMonth()!==cursor.getMonth()?' other':'')+(key(d)===key(new Date())?' today':'');el.innerHTML=`<div class="date">${d.getDate()}</div><div class="events">${items.slice(0,3).map(x=>`<div class="event ${cls(x.vendor)} ${x.done?'done':''}">${x.vendor.replace('오지인터팩코리아','오지인터팩').replace('일신포장산업','일신포장').replace('동진물류포장','동진물류')}</div>`).join('')}${items.length>3?`<div class="more">+${items.length-3}건</div>`:''}</div>`;if(items.length)el.onclick=()=>openDay(d,items);days.appendChild(el)}}function openDay(d,items){panelTitle.textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;list.innerHTML=items.map(x=>`<div class="item"><div class="vendor">${x.vendor}</div><div class="badge ${x.done?'done':''}">${x.done?'완료':'예정'}</div></div>`).join('');modal.classList.add('show')}prev.onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};next.onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};close.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};load();
</script></body></html>
