<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><title>RaySmart · 입고 캘린더</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>
:root{--brand:#7c3aed;--ink:#172b4d;--muted:#667085;--line:#dce6f5;--bg:#f4f7fb}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#f3efff,#f7f9fc 280px);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}button,input,select,label{font:inherit}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}.top{padding:calc(15px + env(safe-area-inset-top)) 15px 13px;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:0;border-radius:13px;background:#fff;color:var(--brand);font-size:27px;font-weight:900;box-shadow:0 6px 18px #173b6b12}.title{font-size:23px;font-weight:1000;letter-spacing:-.8px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.panel{margin:0 12px 12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 9px 26px rgba(23,59,107,.07)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{padding:12px 7px;border-radius:15px;background:#f5f8fc;text-align:center}.sum b{display:block;font-size:20px}.sum span{font-size:10px;color:var(--muted);font-weight:800}.nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-top:14px}.nav button{height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brand);font-size:22px;font-weight:950}.month{text-align:center;font-size:20px;font-weight:1000}.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 1px 3px}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;color:#526174;padding:8px 11px;font-size:12px;font-weight:900}.filter.active{background:var(--brand);border-color:var(--brand);color:#fff}.board{overflow:hidden;border:1px solid var(--line);border-radius:16px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week{background:#f3efff;text-align:center;font-size:11px;font-weight:950;color:#52719d}.week span{padding:9px 2px}.week span:first-child{color:#e24b4b}.week span:last-child{color:#3478d4}.day{position:relative;min-height:84px;padding:6px 4px;border-top:1px solid #edf1f6;border-right:1px solid #edf1f6;background:#fff;overflow:hidden}.day:nth-child(7n){border-right:0}.day.other{background:#f8fafc}.day.today{box-shadow:inset 0 0 0 2px #f2c94c;background:#fffbe6}.date{font-size:12px;font-weight:950;color:#526174}.day:nth-child(7n+1) .date{color:#e24b4b}.day:nth-child(7n) .date{color:#3478d4}.events{display:flex;flex-direction:column;gap:3px;margin-top:5px}.event{border:0;width:100%;border-radius:6px;padding:4px 3px;font-size:8px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.event.done{text-decoration:line-through;opacity:.55}.v0{background:#e8f7ee;color:#14743d}.v1{background:#e9f2ff;color:#1769e0}.v2{background:#fff3df;color:#b15c00}.v3{background:#f3eaff;color:#7e22ce}.state{text-align:center;margin-top:10px;color:#7a879d;font-size:11px;font-weight:800}.adminTitle{font-size:16px;font-weight:1000}.adminNote{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}.adminActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.btn,label.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:12px;padding:10px;text-align:center;font-weight:950;font-size:13px}.primary{background:var(--brand);color:#fff}.soft{background:#f1edff;color:var(--brand)}#file{display:none}.add{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:9px}.add select,.add input{min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.add button{border:0;border-radius:10px;padding:0 13px;background:#172b4d;color:#fff;font-weight:950}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:#0f172a77;padding:12px}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:75vh;overflow:auto;margin:auto;background:#fff;border-radius:22px;padding:17px}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetTitle{font-size:19px;font-weight:1000}.close{border:0;border-radius:10px;background:#f1edff;color:#5b21b6;padding:8px 11px;font-weight:900}.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px}.vendor{font-weight:950}.row small{display:block;color:var(--muted);margin-top:3px}.toggle{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;font-size:11px;font-weight:900}.toggle.on{background:#eaf8ef;color:#14743d}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:430px){.day{min-height:77px;padding:5px 3px}.event{font-size:7.5px}.add{grid-template-columns:1fr}.add button{min-height:42px}}
</style></head><body><div class="app"><header class="top"><button class="back" onclick="location.href='./index.html'">‹</button><div><div class="title">입고 캘린더</div><div class="sub">업체별 입고 예정일과 완료 상태</div></div></header><section class="panel"><div class="summary"><div class="sum"><b id="todayCount">0</b><span>오늘 입고</span></div><div class="sum"><b id="monthCount">0</b><span>이번 달</span></div><div class="sum"><b id="doneCount">0</b><span>완료</span></div></div><div class="nav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><div class="filters" id="filters"></div><div class="board"><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div></div><div class="state" id="state">Calendar.xlsx를 불러오고 있습니다.</div></section><section class="panel"><div class="adminTitle">일정 관리</div><div class="adminNote">Calendar.xlsx를 불러오거나 일정을 직접 추가한 뒤 새 파일로 저장할 수 있습니다.</div><div class="adminActions"><label class="btn soft" for="file">Calendar.xlsx 불러오기</label><button class="btn primary" id="download">Calendar.xlsx 저장</button></div><input id="file" type="file" accept=".xlsx,.xls"><div class="add"><select id="vendor"></select><input id="date" type="date"><button id="add">일정 추가</button></div></section></div><div class="modal" id="modal"><div class="sheet"><div class="sheetHead"><div class="sheetTitle" id="sheetTitle"></div><button class="close" id="close">닫기</button></div><div class="list" id="list"></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script>
const vendors=['세진팩','오지인터팩코리아','일신포장산업','동진물류포장'];let events=[],view=new Date(),filter='전체';view.setDate(1);const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=v=>{if(v instanceof Date)return new Date(v.getFullYear(),v.getMonth(),v.getDate());if(typeof v==='number'){const p=XLSX.SSF.parse_date_code(v);if(p)return new Date(p.y,p.m-1,p.d)}const d=new Date(v);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function loadBook(buf){const b=XLSX.read(buf,{type:'array',cellDates:true});events=[];b.SheetNames.forEach((n,vi)=>XLSX.utils.sheet_to_json(b.Sheets[n],{defval:''}).forEach((r,i)=>{const d=parse(r['입고일']);if(d)events.push({id:`${n}-${i}-${Date.now()}`,vendor:String(r['업체명']||n),date:d,done:String(r['완료']||'').includes('완료')})}));render();$('state').textContent=`총 ${events.length}건의 일정을 불러왔습니다.`}
async function auto(){try{const r=await fetch('./Calendar.xlsx?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;loadBook(await r.arrayBuffer())}catch(e){$('state').textContent='Calendar.xlsx를 찾지 못했습니다. 파일을 불러와 주세요.';render()}}
function color(v){const i=Math.max(0,vendors.indexOf(v));return 'v'+(i%4)}function render(){renderFilters();$('month').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let html='';const today=key(new Date());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const arr=events.filter(e=>key(e.date)===key(d)&&(filter==='전체'||e.vendor===filter));html+=`<div class="day ${d.getMonth()!==view.getMonth()?'other':''} ${key(d)===today?'today':''}" data-date="${key(d)}"><div class="date">${d.getDate()}</div><div class="events">${arr.slice(0,3).map(e=>`<button class="event ${color(e.vendor)} ${e.done?'done':''}" data-id="${e.id}">${e.vendor.replace('오지인터팩코리아','오지인터팩')}</button>`).join('')}${arr.length>3?`<button class="event">+${arr.length-3}</button>`:''}</div></div>`} $('days').innerHTML=html;document.querySelectorAll('.day').forEach(x=>x.onclick=()=>openDay(x.dataset.date));const monthEvents=events.filter(e=>e.date.getFullYear()===view.getFullYear()&&e.date.getMonth()===view.getMonth());$('monthCount').textContent=monthEvents.length;$('doneCount').textContent=monthEvents.filter(e=>e.done).length;$('todayCount').textContent=events.filter(e=>key(e.date)===today).length}
function renderFilters(){$('filters').innerHTML=['전체',...vendors].map(v=>`<button class="filter ${filter===v?'active':''}" data-v="${v}">${v==='오지인터팩코리아'?'오지인터팩':v}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.v;render()})}function openDay(k){const arr=events.filter(e=>key(e.date)===k&&(filter==='전체'||e.vendor===filter));$('sheetTitle').textContent=k;$('list').innerHTML=arr.length?arr.map(e=>`<div class="row"><div><div class="vendor">${e.vendor}</div><small>${e.done?'입고 완료':'입고 예정'}</small></div><button class="toggle ${e.done?'on':''}" data-id="${e.id}">${e.done?'완료':'완료 처리'}</button></div>`).join(''):'<div class="empty">등록된 일정이 없습니다.</div>';$('modal').classList.add('show');document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const e=events.find(x=>x.id===b.dataset.id);e.done=!e.done;openDay(k);render()})}
$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('vendor').innerHTML=vendors.map(v=>`<option>${v}</option>`).join('');$('date').value=key(new Date());$('add').onclick=()=>{if(!$('date').value)return;const d=parse($('date').value+'T00:00:00');events.push({id:'m-'+Date.now(),vendor:$('vendor').value,date:d,done:false});view=new Date(d.getFullYear(),d.getMonth(),1);render();$('state').textContent='일정이 추가되었습니다. 저장 버튼으로 파일을 내려받으세요.'};$('file').onchange=async e=>{if(e.target.files[0])loadBook(await e.target.files[0].arrayBuffer())};$('download').onclick=()=>{const b=XLSX.utils.book_new();vendors.forEach(v=>{const rows=[['업체명','입고일','완료'],...events.filter(e=>e.vendor===v).sort((a,b)=>a.date-b.date).map(e=>[e.vendor,e.date,e.done?'완료':''])];const ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(b,ws,v)});XLSX.writeFile(b,'Calendar.xlsx',{compression:true,cellDates:true})};auto();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
