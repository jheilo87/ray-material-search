<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<title>RAY S/N 추출 V1.0</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--brand:#1769e0;--ink:#14213a;--muted:#667085;--line:#dce6f5;--bg:#f3f7ff;--ok:#137a43;--bad:#b42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#eaf4ff,#f8faff 300px);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input{font:inherit}.app{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:28px}
header{padding:18px 16px 15px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 10px 28px #1769e018;text-align:center}
.title{font-size:25px;font-weight:950;color:var(--brand)}.ver{display:inline-block;margin-top:6px;padding:4px 9px;border-radius:999px;background:#edf5ff;color:#5f76a1;font-size:11px;font-weight:900}
main{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:0 7px 20px #1c4f8a0a;margin-bottom:12px}.cardTitle{font-size:18px;font-weight:950}.sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}
.vendors{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.vendor{border:1px solid #cfdaea;border-radius:13px;background:#fff;padding:13px 8px;font-weight:900;color:#42526b}.vendor.active{background:var(--brand);border-color:var(--brand);color:#fff}
.modeBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modeBtn{min-height:54px;border:0;border-radius:14px;font-size:16px;font-weight:950}.cameraBtn{background:linear-gradient(135deg,var(--brand),#3d8df1);color:#fff}.galleryBtn{background:#eaf3ff;color:var(--brand)}
.hiddenInput{display:none}.note{margin-top:8px;color:#64748b;font-size:12px;line-height:1.5}
.cameraPanel{display:none;margin-top:12px}.cameraPanel.show{display:block}.videoWrap{position:relative;overflow:hidden;border-radius:16px;background:#111;aspect-ratio:3/4}.videoWrap video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 999px #0004}.guideText{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:12px;font-weight:900;text-shadow:0 2px 5px #000}
.cameraControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.capture{min-height:52px;border:0;border-radius:14px;background:#1769e0;color:#fff;font-size:17px;font-weight:950}.finish{min-height:52px;border:0;border-radius:14px;background:#eef2f7;color:#44546b;font-size:16px;font-weight:950}.capture:disabled{opacity:.45}
.liveStatus{margin-top:9px;padding:10px 11px;border-radius:11px;background:#f5f7fa;color:#526174;font-size:12px;font-weight:850;line-height:1.45}.liveStatus.busy{background:#fff8e8;color:#9a6700}.liveStatus.ok{background:#eaf8ef;color:var(--ok)}.liveStatus.bad{background:#fff0f0;color:var(--bad)}
.previewGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.previewGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#eef2f7}
.progress{display:none}.progress.show{display:block}.progressTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.progressText{font-size:14px;font-weight:900;color:#294d7f}.count{padding:5px 9px;border-radius:999px;background:#eaf3ff;color:var(--brand);font-size:12px;font-weight:900}.bar{height:10px;margin-top:10px;background:#e8eef8;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#58a8ff);transition:width .2s}
.resultHead{display:flex;align-items:center;justify-content:space-between}.empty{text-align:center;padding:24px 10px;color:#8a94a6;font-size:13px}.list{display:flex;flex-direction:column;gap:8px;margin-top:11px}.row{display:grid;grid-template-columns:34px minmax(0,1fr) 38px;align-items:center;gap:7px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfdff}.no{text-align:center;color:#8a94a6;font-size:11px}.value{width:100%;min-width:0;border:0;background:transparent;color:#183c71;font-size:15px;font-weight:950;text-transform:uppercase;outline:none}.del{width:34px;height:34px;border:0;border-radius:9px;background:#eef2f7;color:#64748b;font-weight:950}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.action{border:0;border-radius:13px;padding:13px 8px;font-size:15px;font-weight:950}.copy{background:#eaf3ff;color:var(--brand)}.share{background:#1769e0;color:#fff}.clear{grid-column:1/-1;background:#eef2f7;color:#526174}
.status{margin-top:10px;padding:10px 11px;border-radius:11px;background:#f5f7fa;color:#526174;font-size:12px;font-weight:850;line-height:1.5}.status.ok{background:#eaf8ef;color:var(--ok)}.status.bad{background:#fff0f0;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#15243d;color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:850;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
<header><div class="title">RAY S/N 추출</div><div class="ver">V1.0 · 독립형 새 버전</div></header>
<main>
<section class="card">
  <div class="cardTitle">1. 업체 선택</div>
  <div class="sub">업체를 먼저 선택한 다음 내부카메라 또는 일반카메라·갤러리를 이용하세요.</div>
  <div class="vendors">
    <button class="vendor active" data-vendor="iRay">iRay</button>
    <button class="vendor" data-vendor="i3system">i3system</button>
    <button class="vendor" data-vendor="Vieworks">Vieworks</button>
    <button class="vendor" data-vendor="Dell">Dell</button>
  </div>
  <div class="modeBtns">
    <button class="modeBtn cameraBtn" id="openCameraBtn">내부카메라</button>
    <label class="modeBtn galleryBtn" for="imageInput" style="display:flex;align-items:center;justify-content:center">일반카메라·갤러리</label>
  </div>
  <input class="hiddenInput" id="imageInput" type="file" accept="image/*" multiple capture="environment">
  <div class="note">※ 내부카메라는 촬영 후에도 화면이 닫히지 않고 계속 유지됩니다. 일반카메라·갤러리는 촬영한 사진을 불러오는 방식입니다.</div>

  <div class="cameraPanel" id="cameraPanel">
    <div class="videoWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide"></div><div class="guideText">S/N 라벨을 사각형 안에 크게 맞춰주세요</div>
    </div>
    <div class="cameraControls">
      <button class="capture" id="captureBtn">촬영 · 추출</button>
      <button class="finish" id="finishBtn">촬영 종료</button>
    </div>
    <div class="liveStatus" id="liveStatus">카메라 준비 중…</div>
  </div>
  <canvas id="captureCanvas" hidden></canvas>
  <div class="previewGrid" id="previewGrid"></div>
</section>

<section class="card progress" id="progressCard">
  <div class="progressTop"><div class="progressText" id="progressText">추출 준비 중…</div><div class="count" id="progressCount">0/0</div></div>
  <div class="bar"><div class="fill" id="progressFill"></div></div>
</section>

<section class="card">
  <div class="resultHead"><div class="cardTitle">2. S/N 결과</div><div class="count" id="resultCount">0건</div></div>
  <div class="empty" id="empty">아직 추출된 S/N이 없습니다.</div>
  <div class="list" id="resultList"></div>
  <div class="actions">
    <button class="action copy" id="copyBtn">전체 복사</button>
    <button class="action share" id="shareBtn">Teams로 보내기</button>
    <button class="action clear" id="clearBtn">목록 비우기</button>
  </div>
  <div class="status" id="status">업체를 선택하고 촬영을 시작하세요.</div>
</section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
let selectedVendor='iRay';
let results=[];
let stream=null;
let busy=false;
const $=id=>document.getElementById(id);
const video=$('video'), canvas=$('captureCanvas'), imageInput=$('imageInput');
const list=$('resultList'), empty=$('empty'), resultCount=$('resultCount'), status=$('status');

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function setStatus(msg,type=''){status.textContent=msg;status.className='status'+(type?' '+type:'')}
function setLive(msg,type=''){const el=$('liveStatus');el.textContent=msg;el.className='liveStatus'+(type?' '+type:'')}
function clean(s){return String(s||'').toUpperCase().replace(/[\s\u200B]+/g,'').replace(/[“”‘’]/g,'').replace(/[^A-Z0-9_-]/g,'')}
function unique(arr){return [...new Set(arr.map(clean).filter(Boolean))]}

function parseSerials(text,vendor){
  const raw=String(text||'').toUpperCase().replace(/\r/g,'\n');
  const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let out=[];
  for(const line of lines){
    const m=line.match(/(?:S\/?N|SERIAL(?:\s*NUMBER)?|SERVICE\s*TAG|SN)\s*[:#-]?\s*([A-Z0-9][A-Z0-9_-]{4,30})/i);
    if(m) out.push(m[1]);
  }
  const tokens=raw.match(/[A-Z0-9][A-Z0-9_-]{5,30}/g)||[];
  for(const token of tokens){
    const x=clean(token);
    if(/^(SERIAL|NUMBER|SERVICE|SYSTEM|MODEL|PRODUCT|VIEWORKS|IRAY|DELL|MADEINCHINA)$/.test(x)) continue;
    if(vendor==='Dell'){
      if(/^[A-Z0-9]{7}$/.test(x)||/^[A-Z0-9]{10,20}$/.test(x)) out.push(x);
    }else if(vendor==='i3system'){
      if(/^[A-Z0-9_-]{6,24}$/.test(x)) out.push(x);
    }else{
      if(/^[A-Z0-9][A-Z0-9_-]{7,24}$/.test(x)) out.push(x);
    }
  }
  return unique(out).slice(0,10);
}

async function tryBarcode(source){
  if(!('BarcodeDetector' in window)) return [];
  try{
    const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13','ean_8']});
    const bitmap=source instanceof ImageBitmap?source:await createImageBitmap(source);
    const codes=await detector.detect(bitmap);
    if(!(source instanceof ImageBitmap)) bitmap.close?.();
    return unique(codes.map(x=>x.rawValue).filter(x=>String(x).length>=5));
  }catch{return []}
}

async function extractSerial(source){
  const barcodes=await tryBarcode(source);
  const rec=await Tesseract.recognize(source,'eng',{logger:m=>{
    if(m.status==='recognizing text' && typeof m.progress==='number'){
      setLive(`추출 중… ${Math.round(m.progress*100)}%`,'busy');
    }
  }});
  const fromText=parseSerials(rec?.data?.text||'',selectedVendor);
  return unique([...barcodes,...fromText]);
}

function addResults(found){
  const before=results.length;
  results=unique([...results,...found]);
  render();
  return results.length-before;
}

function render(){
  list.innerHTML='';
  empty.style.display=results.length?'none':'block';
  resultCount.textContent=`${results.length}건`;
  results.forEach((value,i)=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<div class="no">${i+1}</div><input class="value" value="${value.replace(/"/g,'&quot;')}" aria-label="S/N ${i+1}"><button class="del" type="button">×</button>`;
    row.querySelector('input').addEventListener('change',e=>{results[i]=clean(e.target.value);results=unique(results);render();saveSession()});
    row.querySelector('.del').addEventListener('click',()=>{results.splice(i,1);render();saveSession()});
    list.appendChild(row);
  });
  saveSession();
}
function saveSession(){try{sessionStorage.setItem('raySnResults',JSON.stringify(results))}catch{}}
function loadSession(){try{const x=JSON.parse(sessionStorage.getItem('raySnResults')||'[]');if(Array.isArray(x))results=unique(x)}catch{}render()}

async function openCamera(){
  if(busy)return;
  stopCamera();
  $('cameraPanel').classList.add('show');
  setLive('카메라 권한 확인 중…','busy');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream;
    await video.play();
    setLive('촬영 준비 완료 · 연속으로 촬영할 수 있습니다.','ok');
  }catch(e){
    setLive('카메라를 열 수 없습니다. 브라우저 권한을 확인하거나 일반카메라·갤러리를 이용하세요.','bad');
  }
}
function stopCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;
}

async function captureAndExtract(){
  if(busy||!stream||!video.videoWidth){toast('카메라가 아직 준비되지 않았어요');return}
  busy=true;$('captureBtn').disabled=true;
  setLive('사진을 저장하고 있습니다…','busy');
  try{
    const w=video.videoWidth,h=video.videoHeight;
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(video,0,0,w,h);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.92));
    if(!blob)throw new Error('capture failed');
    addPreview(blob);
    const found=await extractSerial(blob);
    const added=addResults(found);
    if(added){setLive(`${added}개 저장 완료 · 다음 사진을 촬영하세요.`,'ok');setStatus(`최근 촬영에서 S/N ${added}개를 추가했습니다.`,'ok')}
    else{setLive('S/N을 찾지 못했습니다. 더 가까이 다시 촬영해 주세요.','bad');setStatus('최근 사진에서 S/N을 찾지 못했습니다.','bad')}
  }catch(e){setLive('추출 중 오류가 발생했습니다. 다시 촬영해 주세요.','bad')}
  finally{busy=false;$('captureBtn').disabled=false}
}

function addPreview(source){
  const img=document.createElement('img');
  img.src=URL.createObjectURL(source);
  img.onload=()=>URL.revokeObjectURL(img.src);
  $('previewGrid').prepend(img);
  while($('previewGrid').children.length>6)$('previewGrid').lastElementChild.remove();
}

async function processFiles(files){
  if(!files.length)return;
  $('progressCard').classList.add('show');
  let addedTotal=0,failed=0;
  for(let i=0;i<files.length;i++){
    $('progressText').textContent=`${i+1}번째 사진 추출 중…`;
    $('progressCount').textContent=`${i+1}/${files.length}`;
    $('progressFill').style.width=`${Math.round(i/files.length*100)}%`;
    addPreview(files[i]);
    try{
      const found=await extractSerial(files[i]);
      const added=addResults(found);addedTotal+=added;if(!found.length)failed++;
    }catch{failed++}
  }
  $('progressFill').style.width='100%';$('progressText').textContent='추출 완료';
  setStatus(`완료 · 새 S/N ${addedTotal}개 · 미인식/오류 ${failed}장`,failed?'bad':'ok');
  setTimeout(()=>$('progressCard').classList.remove('show'),1200);
}

async function copyAll(){
  const text=results.filter(Boolean).join('\n');if(!text)return toast('복사할 S/N이 없어요');
  try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  toast('전체 복사 완료');
}

// 업체 선택
document.querySelectorAll('.vendor').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.vendor').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');selectedVendor=btn.dataset.vendor;
  setStatus(`${selectedVendor} 선택됨 · 촬영을 시작하세요.`);
}));

$('openCameraBtn').addEventListener('click',openCamera);
$('captureBtn').addEventListener('click',captureAndExtract);
$('finishBtn').addEventListener('click',()=>{stopCamera();$('cameraPanel').classList.remove('show');setStatus('촬영을 종료했습니다. 결과를 확인하세요.','ok')});
imageInput.addEventListener('change',async()=>{const files=[...(imageInput.files||[])];imageInput.value='';await processFiles(files)});
$('copyBtn').addEventListener('click',copyAll);
$('shareBtn').addEventListener('click',async()=>{
  const text=results.filter(Boolean).join('\n');if(!text)return toast('보낼 S/N이 없어요');
  if(navigator.share){try{await navigator.share({title:'RAY S/N 목록',text});return}catch(e){if(e?.name==='AbortError')return}}
  await copyAll();toast('복사했어요 · Teams에 붙여넣으세요');
});
$('clearBtn').addEventListener('click',()=>{if(!results.length)return;if(confirm('S/N 목록을 모두 비울까요?')){results=[];render();$('previewGrid').innerHTML='';setStatus('목록을 비웠습니다.')}});
window.addEventListener('pagehide',stopCamera);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)stopCamera()});
loadSession();
})();
</script>
</body>
</html>
