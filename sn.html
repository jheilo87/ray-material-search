<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<title>RAY S/N 추출 V1.0</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--brand:#1769e0;--brand2:#58a8ff;--ink:#15213a;--muted:#667085;--line:#dce6f5;--bg:#f3f7ff;--ok:#14743d;--bad:#b42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#eaf4ff,#f7f9fd 280px);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:28px}header{padding:18px 16px 15px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 10px 28px #1769e018;text-align:center}.title{font-size:25px;font-weight:950;color:var(--brand)}.ver{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;background:#edf5ff;color:#5f76a1;font-size:11px;font-weight:900}main{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:0 7px 20px #1c4f8a0a;margin-bottom:12px}.cardTitle{font-size:18px;font-weight:950}.sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}.vendors{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.vendor{border:1px solid #cfdaea;border-radius:13px;background:#fff;padding:13px 8px;font-weight:900;color:#42526b}.vendor.active{background:var(--brand);border-color:var(--brand);color:#fff}.uploadBtn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:12px;min-height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),#3d8df1);color:#fff;font-size:17px;font-weight:950}.uploadBtn.disabled{opacity:.45;pointer-events:none}#photos{display:none}.note{margin-top:8px;color:#64748b;font-size:12px;line-height:1.5}.fileList{display:none;margin-top:11px}.fileList.show{display:block}.fileItem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:10px;background:#f5f8fc;margin-top:6px;font-size:12px}.fileName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileState{font-weight:900;color:var(--brand);white-space:nowrap}.progress{display:none}.progress.show{display:block}.progressTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.progressText{font-size:14px;font-weight:900;color:#294d7f}.bar{height:10px;margin-top:10px;background:#e8eef8;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .2s}.resultHead{display:flex;align-items:center;justify-content:space-between}.count{padding:5px 9px;border-radius:999px;background:#eaf3ff;color:var(--brand);font-size:12px;font-weight:900}.empty{text-align:center;padding:24px 10px;color:#8a94a6;font-size:13px}.list{display:flex;flex-direction:column;gap:8px;margin-top:11px}.row{display:grid;grid-template-columns:34px minmax(0,1fr) 38px;align-items:center;gap:7px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfdff}.no{text-align:center;color:#8a94a6;font-size:11px}.value{width:100%;min-width:0;border:0;background:transparent;color:#183c71;font-size:15px;font-weight:950;text-transform:uppercase;outline:none}.del{width:34px;height:34px;border:0;border-radius:9px;background:#eef2f7;color:#64748b;font-weight:950}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.action{border:0;border-radius:13px;padding:13px 8px;font-size:15px;font-weight:950}.copy{background:#eaf3ff;color:var(--brand)}.share{background:#1769e0;color:#fff}.clear{grid-column:1/-1;background:#eef2f7;color:#526174}.status{margin-top:10px;padding:10px 11px;border-radius:11px;background:#f5f7fa;color:#526174;font-size:12px;font-weight:850;line-height:1.5}.status.ok{background:#eaf8ef;color:var(--ok)}.status.bad{background:#fff0f0;color:var(--bad)}.previewGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.previewGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#eef2f7}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#15243d;color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:850;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
<header><div class="title">RAY S/N 추출</div><div class="ver">V1.0 · 일반카메라 사진 불러오기</div></header>
<main>
<section class="card">
  <div class="cardTitle">1. 업체 선택</div>
  <div class="sub">사진을 찍어둔 뒤 업체를 선택하고 갤러리에서 여러 장을 한 번에 불러오세요.</div>
  <div class="vendors">
    <button class="vendor active" data-vendor="iRay">iRay</button>
    <button class="vendor" data-vendor="i3system">i3system</button>
    <button class="vendor" data-vendor="Vieworks">Vieworks</button>
    <button class="vendor" data-vendor="Dell">Dell</button>
  </div>
  <label class="uploadBtn" for="photos">사진 선택 · S/N 추출</label>
  <input id="photos" type="file" accept="image/*" multiple>
  <div class="note">※ 휴대폰 일반카메라로 먼저 촬영한 사진을 선택합니다. 처음 실행할 때 OCR 파일을 내려받아 인터넷 연결이 필요합니다.</div>
  <div class="previewGrid" id="previewGrid"></div>
  <div class="fileList" id="fileList"></div>
</section>
<section class="card progress" id="progressCard">
  <div class="progressTop"><div class="progressText" id="progressText">추출 준비 중…</div><div class="count" id="progressCount">0/0</div></div>
  <div class="bar"><div class="fill" id="progressFill"></div></div>
</section>
<section class="card">
  <div class="resultHead"><div class="cardTitle">2. S/N 결과</div><div class="count" id="resultCount">0건</div></div>
  <div class="empty" id="empty">아직 추출된 S/N이 없습니다.</div>
  <div class="list" id="resultList"></div>
  <div class="actions">
    <button class="action copy" id="copyBtn">전체 복사</button>
    <button class="action share" id="shareBtn">Teams로 보내기</button>
    <button class="action clear" id="clearBtn">목록 비우기</button>
  </div>
  <div class="status" id="status">업체를 선택하고 사진을 불러오세요.</div>
</section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
let selectedVendor='iRay';
let results=[];
const $=id=>document.getElementById(id);
const photos=$('photos'), list=$('resultList'), empty=$('empty'), count=$('resultCount'), status=$('status');

document.querySelectorAll('.vendor').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.vendor').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active'); selectedVendor=btn.dataset.vendor;
  setStatus(`${selectedVendor} 선택됨 · 사진을 불러오세요.`);
}));

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function setStatus(msg,type=''){status.textContent=msg;status.className='status'+(type?' '+type:'')}
function unique(arr){return [...new Set(arr.map(x=>x.trim().toUpperCase()).filter(Boolean))]}
function clean(s){return String(s||'').toUpperCase().replace(/[\s\u200B]+/g,'').replace(/[“”‘’]/g,'').replace(/[^A-Z0-9_-]/g,'')}

function parseSerials(text,vendor){
 const raw=String(text||'').toUpperCase().replace(/\r/g,'\n');
 const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 let out=[];
 const tagged=[];
 lines.forEach(line=>{
   const m=line.match(/(?:S\/?N|SERIAL(?:\s*NUMBER)?|SERVICE\s*TAG|SN)\s*[:#-]?\s*([A-Z0-9][A-Z0-9_-]{4,30})/i);
   if(m) tagged.push(clean(m[1]));
 });
 if(tagged.length) out.push(...tagged);
 const tokens=raw.match(/[A-Z0-9][A-Z0-9_-]{5,30}/g)||[];
 for(const token of tokens){
   const x=clean(token);
   if(/^(SERIAL|NUMBER|SERVICE|SYSTEM|MODEL|PRODUCT|VIEWORKS|IRAY|DELL)$/.test(x)) continue;
   if(vendor==='Dell'){
     if(/^[A-Z0-9]{7}$/.test(x)||/^[A-Z0-9]{10,20}$/.test(x)) out.push(x);
   }else if(vendor==='i3system'){
     if(/^[A-Z0-9_-]{6,24}$/.test(x)) out.push(x);
   }else if(vendor==='Vieworks'){
     if(/^[A-Z0-9][A-Z0-9_-]{7,24}$/.test(x)) out.push(x);
   }else{
     if(/^[A-Z0-9][A-Z0-9_-]{7,24}$/.test(x)) out.push(x);
   }
 }
 return unique(out).slice(0,8);
}

async function tryBarcode(file){
 if(!('BarcodeDetector' in window)) return [];
 try{
   const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix','ean_13','ean_8']});
   const bitmap=await createImageBitmap(file);
   const codes=await detector.detect(bitmap); bitmap.close?.();
   return unique(codes.map(x=>clean(x.rawValue)).filter(x=>x.length>=5));
 }catch{return []}
}

async function ocrFile(file){
 const barcodes=await tryBarcode(file);
 if(selectedVendor==='i3system' && barcodes.length) return barcodes;
 const rec=await Tesseract.recognize(file,'eng',{logger:()=>{}});
 const fromText=parseSerials(rec?.data?.text||'',selectedVendor);
 return unique([...barcodes,...fromText]);
}

function render(){
 list.innerHTML='';
 empty.style.display=results.length?'none':'block';
 count.textContent=`${results.length}건`;
 results.forEach((value,i)=>{
   const row=document.createElement('div');row.className='row';
   row.innerHTML=`<div class="no">${i+1}</div><input class="value" value="${value.replace(/"/g,'&quot;')}" aria-label="S/N ${i+1}"><button class="del" type="button">×</button>`;
   row.querySelector('input').addEventListener('change',e=>{results[i]=clean(e.target.value);results=unique(results);render()});
   row.querySelector('.del').addEventListener('click',()=>{results.splice(i,1);render()});
   list.appendChild(row);
 });
}

photos.addEventListener('change',async()=>{
 const files=[...(photos.files||[])]; photos.value=''; if(!files.length)return;
 $('previewGrid').innerHTML=''; $('fileList').innerHTML=''; $('fileList').classList.add('show');
 files.forEach((f,i)=>{
   const img=document.createElement('img');img.src=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(img.src);$('previewGrid').appendChild(img);
   const item=document.createElement('div');item.className='fileItem';item.innerHTML=`<span class="fileName">${i+1}. ${f.name}</span><span class="fileState" id="fs${i}">대기</span>`;$('fileList').appendChild(item);
 });
 $('progressCard').classList.add('show');
 let added=0,failed=0;
 for(let i=0;i<files.length;i++){
   $('progressText').textContent=`${i+1}번째 사진 추출 중…`;$('progressCount').textContent=`${i+1}/${files.length}`;$('progressFill').style.width=`${Math.round(i/files.length*100)}%`;
   $('fs'+i).textContent='추출 중';
   try{
     const found=await ocrFile(files[i]);
     if(found.length){const before=results.length;results=unique([...results,...found]);added+=results.length-before;$('fs'+i).textContent=`${found.length}개 발견`;$('fs'+i).style.color='#14743d';}
     else{failed++;$('fs'+i).textContent='미인식';$('fs'+i).style.color='#b42318';}
     render();
   }catch(e){failed++;$('fs'+i).textContent='오류';$('fs'+i).style.color='#b42318';}
 }
 $('progressFill').style.width='100%';$('progressText').textContent='추출 완료';
 setStatus(`완료 · 새 S/N ${added}개 · 미인식/오류 ${failed}장`,failed?'bad':'ok');
 setTimeout(()=>$('progressCard').classList.remove('show'),1200);
});

async function copyAll(){
 const text=results.filter(Boolean).join('\n');if(!text)return toast('복사할 S/N이 없어요');
 try{await navigator.clipboard.writeText(text);toast('전체 복사 완료')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('전체 복사 완료')}
}
$('copyBtn').addEventListener('click',copyAll);
$('shareBtn').addEventListener('click',async()=>{
 const text=results.filter(Boolean).join('\n');if(!text)return toast('보낼 S/N이 없어요');
 if(navigator.share){try{await navigator.share({title:'RAY S/N 목록',text});return}catch(e){if(e?.name==='AbortError')return}}
 await copyAll();toast('복사했어요 · Teams에 붙여넣으세요');
});
$('clearBtn').addEventListener('click',()=>{if(!results.length)return; if(confirm('S/N 목록을 모두 비울까요?')){results=[];render();$('previewGrid').innerHTML='';$('fileList').innerHTML='';$('fileList').classList.remove('show');setStatus('목록을 비웠습니다.')}});
render();
})();
</script>
</body>
</html>
